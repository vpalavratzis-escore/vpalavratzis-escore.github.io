<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Recent Matches — VoxCourt</title>
  <meta
    name="description"
    content="Browse recent completed matches across VoxCourt clubs and courts."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #02080a;
      --bg-2: #061216;
      --surface: rgba(5, 13, 16, 0.90);
      --surface-2: rgba(8, 19, 22, 0.82);
      --surface-3: rgba(255, 255, 255, 0.035);

      --text: #f4f7f7;
      --muted: rgba(224, 234, 235, 0.68);
      --muted-2: rgba(224, 234, 235, 0.48);

      --teal: #08b8bb;
      --teal-2: #07959e;
      --cyan: #4ce4e5;
      --amber: #f09232;
      --amber-2: #ffba62;

      --line: rgba(102, 222, 224, 0.16);
      --line-soft: rgba(255, 255, 255, 0.075);

      --shadow-lg: 0 34px 100px rgba(0, 0, 0, 0.56);
      --shadow-md: 0 20px 60px rgba(0, 0, 0, 0.38);

      --radius-xl: 34px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --content: 1440px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(1000px 700px at 95% -10%, rgba(8, 184, 187, 0.13), transparent 64%),
        radial-gradient(900px 700px at 0% 5%, rgba(240, 146, 50, 0.10), transparent 60%),
        linear-gradient(180deg, #010608 0%, #031013 55%, #06191b 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.012) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.55), transparent 72%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    select {
      font: inherit;
    }

    .wrap {
      width: min(var(--content), calc(100% - 40px));
      margin: 0 auto;
      padding: 18px 0 56px;
    }

    /* =========================
       SAME HEADER AS MAIN SITE
    ========================= */

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 30;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 28px;
      min-height: 82px;
      padding: 12px 18px;
      margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(4, 11, 14, 0.94), rgba(2, 8, 10, 0.91));
      box-shadow:
        0 18px 60px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      width: 225px;
      min-width: 225px;
    }

    .brand img {
      display: block;
      width: auto;
      height: 50px;
      max-width: 225px;
      object-fit: contain;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(15px, 2vw, 30px);
      min-width: 0;
      color: rgba(224, 234, 235, 0.72);
      font-size: 14px;
      font-weight: 760;
    }

    .nav a {
      position: relative;
      white-space: nowrap;
      transition: color .2s ease;
    }

    .nav a::after {
      content: "";
      position: absolute;
      right: 50%;
      bottom: -11px;
      left: 50%;
      height: 2px;
      border-radius: 2px;
      background: var(--teal);
      transition: right .2s ease, left .2s ease;
    }

    .nav a:hover,
    .nav a.active {
      color: #fff;
    }

    .nav a:hover::after,
    .nav a.active::after {
      right: 0;
      left: 0;
    }

    .header-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 19px;
      border: 1px solid rgba(8, 184, 187, .62);
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(11, 193, 196, .96), rgba(5, 137, 146, .94));
      color: #ecffff;
      font-weight: 850;
      line-height: 1.1;
      box-shadow:
        0 16px 40px rgba(0, 170, 176, .22),
        inset 0 1px 0 rgba(255,255,255,.24);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .header-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 46px rgba(0,0,0,.36);
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      padding: clamp(32px, 4vw, 52px);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 88% 20%, rgba(8,184,187,.13), transparent 30%),
        radial-gradient(circle at 95% 90%, rgba(240,146,50,.08), transparent 25%),
        linear-gradient(180deg, rgba(7,17,20,.93), rgba(3,10,12,.94));
      box-shadow: var(--shadow-md);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 13px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: .11em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow:
        0 0 0 6px rgba(8,184,187,.10),
        0 0 22px rgba(8,184,187,.46);
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 4.5vw, 62px);
      line-height: 1.02;
      letter-spacing: -.045em;
    }

    .sub {
      max-width: 760px;
      margin: 15px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    /* =========================
       MATCH PANEL
    ========================= */

    .panel {
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background:
        radial-gradient(circle at 95% 0%, rgba(8,184,187,.06), transparent 28%),
        linear-gradient(180deg, rgba(7,16,19,.91), rgba(3,10,12,.93));
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(16px);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 12px;
      margin-bottom: 18px;
    }

    select,
    button {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,.045);
      color: var(--text);
      font-weight: 700;
    }

    select {
      cursor: pointer;
    }

    select:focus {
      border-color: rgba(8,184,187,.55);
      box-shadow: 0 0 0 3px rgba(8,184,187,.10);
    }

    select option {
      background: #061216;
      color: var(--text);
    }

    button {
      width: auto;
      min-width: 120px;
      padding-inline: 20px;
      border-color: rgba(8,184,187,.62);
      background:
        linear-gradient(180deg, rgba(11,193,196,.96), rgba(5,137,146,.94));
      color: #ecffff;
      font-weight: 850;
      cursor: pointer;
      box-shadow:
        0 14px 34px rgba(0,170,176,.17),
        inset 0 1px 0 rgba(255,255,255,.20);
      transition: transform .2s ease, filter .2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(2,10,12,.72);
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    thead th {
      padding: 15px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(3,13,16,.96);
      color: rgba(232,240,241,.79);
      font-size: 13px;
      font-weight: 800;
      text-align: left;
    }

    tbody td {
      padding: 16px;
      border-bottom: 1px solid var(--line-soft);
      color: rgba(244,247,247,.92);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    tbody tr {
      transition: background .18s ease;
    }

    tbody tr:hover {
      background: rgba(8,184,187,.055);
    }

    .score {
      color: var(--amber-2);
      font-weight: 900;
      letter-spacing: .3px;
    }

    .muted {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      padding: 6px 10px;
      border: 1px solid rgba(8,184,187,.22);
      border-radius: 999px;
      background: rgba(8,184,187,.08);
      color: rgba(225,252,252,.90);
      font-size: 12px;
      font-weight: 800;
    }

    .empty {
      padding: 28px;
      color: var(--muted);
      text-align: center;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 18px;
      padding: 10px 4px 0;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 750;
    }

    /* =========================
       TABLET / MOBILE
    ========================= */

    @media (max-width: 920px) {
      .wrap {
        width: min(100% - 28px, var(--content));
        padding-top: 14px;
      }

      .topbar {
        position: relative;
        top: auto;
        grid-template-columns: 1fr auto;
        min-height: 70px;
      }

      .brand {
        width: 195px;
        min-width: 195px;
      }

      .brand img {
        height: 43px;
        max-width: 195px;
      }

      .nav {
        display: none;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }
    }

    @media (max-width: 640px) {
      .wrap {
        width: calc(100% - 18px);
        padding-top: 9px;
      }

      .topbar {
        gap: 8px;
        padding: 9px 10px;
        border-radius: 16px;
      }

      .brand {
        width: 158px;
        min-width: 158px;
      }

      .brand img {
        height: 35px;
        max-width: 158px;
      }

      .header-cta {
        min-height: 40px;
        padding: 10px 11px;
        font-size: 11px;
      }

      .hero,
      .panel {
        padding: 24px 17px;
        border-radius: 22px;
      }

      h1 {
        font-size: 38px;
      }

      .sub {
        font-size: 15px;
      }

      .footer {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <header class="topbar">
      <a
        class="brand"
        href="/tennislive-match/"
        aria-label="Go to VoxCourt home"
      >
        <img
          src="/tennislive-match/logoText.png"
          alt="VoxCourt"
        />
      </a>

      <nav class="nav" aria-label="Main navigation">
        <a href="/tennislive-match/">Home</a>
        <a href="/tennislive-match/live">Find courts</a>
        <a class="active" href="/matches/">Match Results</a>
      </nav>

      <a class="header-cta" href="/tennislive-match/live">
        Open a court
      </a>
    </header>

    <main>
      <section class="hero">
        <div class="eyebrow">Match archive</div>
        <h1>Recent Matches</h1>
        <p class="sub">
          Browse the latest completed matches across VoxCourt clubs and courts.
        </p>
      </section>

      <section class="panel">
        <div class="toolbar">
          <select id="countryFilter" aria-label="Filter by country">
            <option value="">All Countries</option>
          </select>

          <select id="clubFilter" aria-label="Filter by club">
            <option value="">All Clubs</option>
          </select>

          <select id="courtFilter" aria-label="Filter by court">
            <option value="">All Courts</option>
          </select>

          <button id="refreshBtn" type="button">Refresh</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Date &amp; Time</th>
                <th>Player A</th>
                <th>Player B</th>
                <th>Score</th>
                <th>Country</th>
                <th>Club</th>
                <th>Court</th>
              </tr>
            </thead>

            <tbody id="matchesBody">
              <tr>
                <td colspan="7" class="empty">Loading matches...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>© <span id="year"></span> VoxCourt.</span>
      <span>Smart scoring for modern courts.</span>
    </footer>
  </div>

  <script>
    const API_URL = "https://api.voxcourt.com/api/matches?limit=100";
    let allMatches = [];

    function parseCourtKey(courtKey = "") {
      const parts = String(courtKey).split("/").filter(Boolean);

      return {
        country: parts[0] || "",
        region: parts[1] || "",
        club: parts[2] || "",
        court: parts[3] || ""
      };
    }

    function prettyLabel(value) {
      return String(value || "")
        .replace(/-/g, " ")
        .replace(/\b\w/g, character => character.toUpperCase());
    }

    function fillSelect(selectElement, values, placeholder) {
      const currentValue = selectElement.value;

      selectElement.innerHTML = `<option value="">${placeholder}</option>`;

      values.forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = prettyLabel(value);
        selectElement.appendChild(option);
      });

      selectElement.value = values.includes(currentValue) ? currentValue : "";
    }

    function renderFilters(items) {
      const countries = [
        ...new Set(
          items
            .map(match => parseCourtKey(match.courtKey).country)
            .filter(Boolean)
        )
      ].sort();

      const clubs = [
        ...new Set(
          items
            .map(match => parseCourtKey(match.courtKey).club)
            .filter(Boolean)
        )
      ].sort();

      const courts = [
        ...new Set(
          items
            .map(match => parseCourtKey(match.courtKey).court)
            .filter(Boolean)
        )
      ].sort();

      fillSelect(
        document.getElementById("countryFilter"),
        countries,
        "All Countries"
      );

      fillSelect(
        document.getElementById("clubFilter"),
        clubs,
        "All Clubs"
      );

      fillSelect(
        document.getElementById("courtFilter"),
        courts,
        "All Courts"
      );
    }

    function renderTable(items) {
      const body = document.getElementById("matchesBody");

      if (!items.length) {
        body.innerHTML =
          `<tr><td colspan="7" class="empty">No matches found.</td></tr>`;
        return;
      }

      body.innerHTML = "";

      items.forEach(match => {
        const metadata = parseCourtKey(match.courtKey);
        const date = new Date(
          match.finishedAt ||
          match.submittedAt ||
          Date.now()
        );

        const row = document.createElement("tr");

        row.innerHTML = `
          <td>
            <div>${date.toLocaleDateString()}</div>
            <div class="muted">${date.toLocaleTimeString()}</div>
          </td>
          <td>${match.playerA || "-"}</td>
          <td>${match.playerB || "-"}</td>
          <td class="score">${match.setsA ?? "-"} - ${match.setsB ?? "-"}</td>
          <td>
            <span class="badge">
              ${prettyLabel(metadata.country) || "-"}
            </span>
          </td>
          <td>${prettyLabel(metadata.club) || "-"}</td>
          <td>${prettyLabel(metadata.court) || "-"}</td>
        `;

        body.appendChild(row);
      });
    }

    function applyFilters() {
      const country = document.getElementById("countryFilter").value;
      const club = document.getElementById("clubFilter").value;
      const court = document.getElementById("courtFilter").value;

      const filteredMatches = allMatches.filter(match => {
        const metadata = parseCourtKey(match.courtKey);

        if (country && metadata.country !== country) return false;
        if (club && metadata.club !== club) return false;
        if (court && metadata.court !== court) return false;

        return true;
      });

      renderTable(filteredMatches);
    }

    async function loadMatches() {
      const body = document.getElementById("matchesBody");

      body.innerHTML =
        `<tr><td colspan="7" class="empty">Loading matches...</td></tr>`;

      try {
        const response = await fetch(API_URL);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        allMatches = Array.isArray(data.items) ? data.items : [];

        renderFilters(allMatches);
        applyFilters();
      } catch (error) {
        console.error("Failed to load matches:", error);

        body.innerHTML =
          `<tr><td colspan="7" class="empty">Failed to load matches.</td></tr>`;
      }
    }

    document
      .getElementById("countryFilter")
      .addEventListener("change", applyFilters);

    document
      .getElementById("clubFilter")
      .addEventListener("change", applyFilters);

    document
      .getElementById("courtFilter")
      .addEventListener("change", applyFilters);

    document
      .getElementById("refreshBtn")
      .addEventListener("click", loadMatches);

    document.getElementById("year").textContent =
      String(new Date().getFullYear());

    loadMatches();
  </script>
</body>
</html>

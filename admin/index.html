<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoxCourt Master Admin</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
<main class="shell">
  <header><img src="https://voxcourt.com/tennislive-match/logoText.png" alt="VoxCourt"><span>MASTER ADMIN · CEO CONTROL</span></header>
  <section class="hero"><div class="eyebrow">VOXCOURT CONTROL</div><h1>Every club.<br><span>Full control.</span></h1><p>VoxCourt staff access only. Open any club account, edit every setting, suspend service for billing, re-enable it or permanently delete the account and schedule its data purge.</p></section>
  <section class="card" id="login"><h2>Master admin key</h2><form id="loginForm"><input id="adminKey" type="password" autocomplete="off" placeholder="VCA-..." required><button>Open console</button></form><div id="loginMsg" class="msg" hidden></div></section>
  <section id="console" hidden><div class="toolbar"><div><h2>Club registry</h2><span id="count"></span></div><button id="refresh">Refresh</button></div><div id="clubs" class="clubs"></div></section>
</main>
<script src="./admin.js"></script>
</body>
</html>
